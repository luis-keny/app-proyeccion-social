schema: spec-driven

context: |
  Escribir en español; conservar encabezados estructurales y SHALL/MUST en inglés.
  Sistema de proyección social UPeU: una sede, sin inscripción previa,
  confirmación de identidad y crédito fijo por sesión asistida.
  Monolito Next.js con InsForge como base de datos.
  La aplicación actual es una demo sin persistencia ni permisos reales verificados.
  Leer AGENTS.md, docs/README.md y las decisiones relacionadas.
  El humano acepta propuestas, autoriza alcance/entorno y acepta resultados.
  Registrar decisiones humanas en review.md; no repetir autorizaciones vigentes.
  Etapa documental: no implementar backend ni mover código por iniciativa propia.
  Documentación humana concisa, sin versiones ni diarios; historial en Git/OpenSpec.
  Modelo de datos, estructura modular y mecanismo de acceso siguen propuestos.

rules:
  proposal:
    - Explicar necesidad, alcance, exclusiones e impacto.
  specs:
    - Definir comportamiento observable y escenarios relevantes de error/permisos.
    - Distinguir requisitos aceptados de propuestas pendientes.
  design:
    - Explicar alternativas, integridad, permisos y decisiones bloqueantes.
  tasks:
    - Separar trabajo autorizado, validación y aceptación pendiente.
